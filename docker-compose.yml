version: '3.9'

services:
  postgres:
    image: postgres:17-alpine3.22

    container_name: subscriptions-postgres

    restart: always

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-subscriptions}

    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data

    env_file:
      - .env

  migrate:
    image: migrate/migrate:v4.19.1

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./migrations:/migrations

    command: [
      "-path", "/migrations",
      "-database", "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-subscriptions}?sslmode=disable",
      "up"
    ]

    env_file:
      - .env

  app:
    build: .

    container_name: subscriptions-app

    restart: always
    
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    
    env_file:
      - .env

volumes:
  postgres_data: